name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-policy:
    name: Validate merge-request version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source and base history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Require an incremented semantic version and changelog entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '$1 == "sdkVersion" { print $2 }' gradle.properties)"
          base_version="$(git show "$BASE_SHA:gradle.properties" | awk -F= '$1 == "sdkVersion" { print $2 }')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" != "$base_version"
          test "$(printf '%s\n%s\n' "$base_version" "$version" | sort -V | tail -n 1)" = "$version"
          grep -q "^## $version - " CHANGELOG.md

  verify:
    name: Verify on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java:
          - "17"
          - "21"

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Clean workspace
        run: ./gradlew --no-daemon clean

      - name: Run production verification
        run: ./gradlew --no-daemon check dokkaGeneratePublicationHtml

      - name: Verify publication
        if: matrix.java == '17'
        run: ./gradlew --no-daemon publishToMavenLocal

      - name: Upload test, static-analysis, and coverage reports
        if: always() && matrix.java == '17'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated API documentation
        if: matrix.java == '17'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-documentation
          path: build/documentation/html/
          if-no-files-found: error
          retention-days: 14

  package-smoke:
    name: Package control panel (${{ matrix.format }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            format: dmg
          - os: windows-latest
            task: packageMsi
            format: msi
          - os: ubuntu-latest
            task: packageDeb
            format: deb

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test and build native installer
        shell: bash
        run: ./gradlew --no-daemon :control-panel:test :control-panel:${{ matrix.task }}

      - name: Verify installer output
        shell: pwsh
        run: |
          $packages = Get-ChildItem "control-panel/build/compose/binaries/main/${{ matrix.format }}" -File
          if ($packages.Count -ne 1) {
            throw "Expected exactly one ${{ matrix.format }} installer, found $($packages.Count)."
          }
          if ($packages[0].Length -le 0) {
            throw "The generated ${{ matrix.format }} installer is empty."
          }

  dependency-graph:
    name: Submit dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
