kotlin.code.style=official
sdkGroup=com.qurkos.afc
sdkVersion=3.0.0
# Kotlin Multiplatform IDE dependency resolution is not configuration-cache compatible yet.
# Build output caching is disabled until the stable Kotlin line includes the build-cache deserialization fix.
org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.caching=false
# Report Gradle/plugin deprecations without breaking IntelliJ sync. Source compiler
# warnings remain errors, and check still enforces ktlint, Detekt, ABI, and coverage.
org.gradle.warning.mode=all
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
