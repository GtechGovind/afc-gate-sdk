name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft=true
          else
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
          fi

  sdk:
    name: Verify and publish SDK
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate tag and project version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          project_version="$(./gradlew -q properties | awk '/^version:/ { print $2 }')"
          test "$GITHUB_REF_NAME" = "$project_version"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release tags must point to a commit already reachable from origin/main." >&2
            exit 1
          }

      - name: Clean and verify release
        run: ./gradlew --no-daemon clean check dokkaHtmlJar assemble :control-panel:jar publishToMavenLocal

      - name: Publish SDK to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon publish 2>&1 | tee publish.log
          publish_status=${PIPESTATUS[0]}
          set -e
          if [[ "$publish_status" -ne 0 ]]; then
            if grep -q "Received status code 409 from server: Conflict" publish.log; then
              echo "SDK version $GITHUB_REF_NAME is already present in GitHub Packages."
            else
              exit "$publish_status"
            fi
          fi

      - name: Stage SDK and compiled UI JARs
        shell: bash
        run: |
          mkdir -p release-assets
          cp build/libs/* release-assets/
          cp control-panel/build/libs/afc-gate-control-panel-*.jar release-assets/

      - name: Generate JAR checksums
        shell: bash
        run: |
          set -euo pipefail
          for path in release-assets/*; do
            file="$(basename "$path")"
            (cd release-assets && sha256sum "$file" > "$file.sha256")
          done

      - name: Attest JAR artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*

      - name: Upload JARs directly to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber

  control-panel:
    name: Package control panel (${{ matrix.format }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            format: dmg
          - os: windows-latest
            task: packageMsi
            format: msi
          - os: ubuntu-latest
            task: packageDeb
            format: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test and package desktop application
        shell: bash
        run: ./gradlew --no-daemon :control-panel:test :control-panel:${{ matrix.task }}

      - name: Generate installer checksum
        shell: pwsh
        run: |
          Get-ChildItem "control-panel/build/compose/binaries/main/${{ matrix.format }}" -File | ForEach-Object {
            $asset = $_
            $stableName = $asset.Name -replace ' ', '.'
            if ($stableName -ne $asset.Name) {
              Rename-Item -LiteralPath $asset.FullName -NewName $stableName
              $asset = Get-Item (Join-Path $asset.DirectoryName $stableName)
            }
            $hash = (Get-FileHash -Algorithm SHA256 $asset.FullName).Hash.ToLower()
            "$hash  $($asset.Name)" | Set-Content -NoNewline "$($asset.FullName).sha256"
          }

      - name: Attest native installer
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: control-panel/build/compose/binaries/main/${{ matrix.format }}/*

      - name: Upload installer directly to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" control-panel/build/compose/binaries/main/${{ matrix.format }}/* --clobber

  finalize-release:
    name: Publish GitHub release
    needs:
      - sdk
      - control-panel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
